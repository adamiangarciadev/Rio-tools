name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare lightweight site artifact
        run: |
          mkdir -p .pages
          cp index.html .pages/
          cp -R assets apps data .pages/
          find .pages -type f \( -name '*.gs' -o -name '*.md' \) -delete
          touch .pages/.nojekyll

      - name: Verify shared CSV files in the published artifact
        run: |
          test -s .pages/data/equivalencia.csv
          test -s .pages/data/equivalencia2.csv
          test -s '.pages/data/ASISTENCIA_RIO - PADRON.csv'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 30
          reporting_interval: 10000
