name: Actualizar carteles Canva

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-carteles-canva
  cancel-in-progress: false

jobs:
  update-carteles:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restaurar token Canva
        uses: actions/cache@v4
        with:
          path: tools/canva-sync/.canva-token.json
          key: canva-token-${{ github.run_id }}
          restore-keys: |
            canva-token-

      - name: Crear credenciales Canva
        shell: pwsh
        run: |
          @"
          CANVA_CLIENT_ID=${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET=${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REDIRECT_URI=http://127.0.0.1:3001/oauth/redirect
          CANVA_SCOPES=design:meta:read design:content:read
          "@ | Set-Content -NoNewline -Encoding UTF8 tools/canva-sync/.env

          if (!(Test-Path tools/canva-sync/.canva-token.json)) {
            '${{ secrets.CANVA_TOKEN_JSON }}' | Set-Content -NoNewline -Encoding UTF8 tools/canva-sync/.canva-token.json
          }

      - name: Instalar dependencias Python
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pdfplumber pypdf

      - name: Instalar Poppler
        shell: pwsh
        run: |
          choco install poppler -y --no-progress

      - name: Actualizar carteles
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/canva-sync/update-carteles.ps1

      - name: Validar salida generada
        shell: pwsh
        run: |
          if (!(Test-Path apps/pedido-carteleria/designs.json)) {
            throw "No se genero apps/pedido-carteleria/designs.json"
          }

          $data = Get-Content -Raw apps/pedido-carteleria/designs.json | ConvertFrom-Json
          $pages = ($data | ForEach-Object { $_.items.Count } | Measure-Object -Sum).Sum

          if ($pages -lt 1) {
            throw "designs.json no contiene paginas"
          }

          $missingAssets = @(
            $data |
              ForEach-Object { $_.items } |
              ForEach-Object {
                foreach ($asset in @($_.image, $_.pdf)) {
                  $assetPath = Join-Path "apps/pedido-carteleria" $asset
                  if (!(Test-Path -LiteralPath $assetPath -PathType Leaf)) {
                    $assetPath
                  }
                }
              }
          )

          if ($missingAssets.Count -gt 0) {
            $sample = ($missingAssets | Select-Object -First 10) -join "`n"
            throw "Hay $($missingAssets.Count) assets referenciados que no existen:`n$sample"
          }

          Write-Host "Paginas generadas: $pages. Todas las imagenes y PDFs fueron validados."

      - name: Commit cambios generados
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add `
            apps/pedido-carteleria/designs.json `
            apps/pedido-carteleria/downloads `
            apps/pedido-carteleria/page-pdfs `
            apps/pedido-carteleria/previews

          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Actualizar carteles desde Canva"
            git push
          } else {
            Write-Host "No hay cambios para commitear."
          }
