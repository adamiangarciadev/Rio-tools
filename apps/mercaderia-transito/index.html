<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MERCADERIA EN TRANSITO</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>MERCADERIA EN TRANSITO</h1>
      <p>Control de remitos por sucursal</p>
    </div>

    <div class="top-actions">
      <label for="sucursalSelect">Sucursal</label>
      <select id="sucursalSelect"></select>
      <button id="refreshBtn" class="btn secondary">Actualizar</button>
    </div>
  </header>

  <main class="container">
    <div id="estadoCarga" class="estado-carga"></div>
    <div id="cardsWrap" class="cards"></div>
  </main>

  <div id="modalDif" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2>Cargar diferencias</h2>
        <button id="cerrarModalBtn" class="btn ghost">✕</button>
      </div>

      <div class="modal-body">
        <div class="campo">
          <label>Remito</label>
          <input id="difRemito" type="text" readonly />
        </div>

        <div class="campo">
          <label>Observaciones</label>
          <textarea id="difObs" placeholder="Detallá acá todas las diferencias..."></textarea>
        </div>

        <div class="campo">
          <label>Adjuntar fotos o videos</label>
          <input id="difFiles" type="file" multiple accept="image/*,video/*" />
          <small>Fotos y videos cortos. Los archivos pesados pueden fallar por límite de Apps Script.</small>
        </div>

        <div id="filesPreview" class="files-preview"></div>
      </div>

      <div class="modal-actions">
        <button id="guardarDifBtn" class="btn primary">Guardar diferencias</button>
      </div>
    </div>
  </div>
  <div id="modalPdf" class="modal hidden">
  <div class="modal-box modal-pdf-box">
    <div class="modal-head">
      <h2 id="pdfModalTitle">Visualizar remito</h2>
      <button id="cerrarPdfModalBtn" class="btn ghost">✕</button>
    </div>

    <div class="modal-body modal-pdf-body">
      <iframe
        id="pdfViewerFrame"
        src=""
        frameborder="0"
        allow="autoplay"
      ></iframe>
    </div>
  </div>
</div>
  <script src="app.js"></script>
</body>
</html>
