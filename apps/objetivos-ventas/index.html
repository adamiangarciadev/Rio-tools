<!doctype html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RIO | Objetivos de venta</title>
  <style>
    :root { color-scheme: dark; --bg:#090d12; --card:#111821; --card2:#151e29; --line:rgba(148,163,184,.16); --text:#edf3fa; --muted:#94a3b8; --primary:#22c7b8; --ok:#34d399; --warn:#f59e0b; --danger:#fb7185; font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; background:radial-gradient(circle at top right,rgba(34,199,184,.10),transparent 34%),var(--bg); color:var(--text); }
    button,input { font:inherit; }
    .hidden { display:none !important; }
    .login { min-height:100vh; display:grid; place-items:center; padding:24px; }
    .login-card { width:min(430px,100%); padding:34px; border:1px solid var(--line); border-radius:18px; background:rgba(17,24,33,.96); box-shadow:0 24px 80px rgba(0,0,0,.3); }
    .brand { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
    .logo { width:48px; height:48px; display:grid; place-items:center; border-radius:13px; background:var(--primary); color:#061017; font-weight:900; }
    h1,h2,p { margin-top:0; } h1 { margin-bottom:6px; font-size:1.55rem; } .muted { color:var(--muted); }
    label { display:grid; gap:7px; margin:16px 0; color:var(--muted); font-size:.88rem; font-weight:650; }
    input { width:100%; min-height:48px; padding:0 14px; color:var(--text); border:1px solid var(--line); border-radius:10px; background:#090f16; outline:none; }
    input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(34,199,184,.12); }
    button { min-height:46px; padding:0 18px; border:0; border-radius:10px; background:var(--primary); color:#061017; font-weight:800; cursor:pointer; }
    button[disabled] { opacity:.55; cursor:wait; }
    .error { min-height:20px; margin-top:14px; color:var(--danger); font-size:.88rem; }
    .shell { width:min(1180px,calc(100% - 32px)); margin:auto; padding:24px 0 52px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:28px; }
    .store-title { margin:0; font-size:clamp(1.6rem,4vw,2.7rem); } .period { margin:6px 0 0; color:var(--muted); }
    .logout { background:transparent; color:var(--muted); border:1px solid var(--line); }
    .grid { display:grid; grid-template-columns:repeat(12,1fr); gap:16px; }
    .card { grid-column:span 4; padding:22px; border:1px solid var(--line); border-radius:15px; background:rgba(17,24,33,.92); }
    .card.wide { grid-column:span 8; } .card.full { grid-column:1/-1; }
    .label { color:var(--muted); font-size:.8rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
    .value { margin:9px 0 3px; font-size:clamp(1.55rem,3vw,2.3rem); font-weight:800; }
    .sub { color:var(--muted); font-size:.86rem; }
    .progress { height:13px; margin:20px 0 12px; overflow:hidden; border-radius:999px; background:#080d13; }
    .progress span { display:block; width:0; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--primary),var(--ok)); transition:width .5s ease; }
    .progress.warn span { background:linear-gradient(90deg,var(--warn),var(--primary)); }
    .split { display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:.86rem; }
    table { width:100%; margin-top:16px; border-collapse:collapse; } th,td { padding:13px 10px; text-align:right; border-bottom:1px solid var(--line); } th:first-child,td:first-child { text-align:left; } th { color:var(--muted); font-size:.74rem; text-transform:uppercase; } td { font-variant-numeric:tabular-nums; }
    .positive { color:var(--ok); } .negative { color:var(--danger); }
    .day-type { display:inline-flex; margin-left:7px; padding:2px 6px; border-radius:999px; color:var(--muted); background:rgba(148,163,184,.09); font-size:.68rem; font-weight:700; }
    tr.saturday .day-type { color:var(--primary); background:rgba(34,199,184,.10); }
    tr.holiday .day-type { color:var(--warn); background:rgba(245,158,11,.10); }
    tr.closed { opacity:.58; }
    .status { display:inline-flex; padding:5px 9px; border-radius:999px; background:rgba(34,199,184,.1); color:var(--primary); font-size:.78rem; font-weight:750; }
    @media(max-width:760px){ .card,.card.wide { grid-column:1/-1; } .login-card{padding:24px;} header{align-items:flex-start;} table{font-size:.82rem;} th,td{padding:11px 5px;} }
  </style>
</head>
<body>
  <main id="loginView" class="login">
    <form id="loginForm" class="login-card">
      <div class="brand"><div class="logo">RIO</div><div><h1>Objetivos de venta</h1><div class="muted">Ingresá con los datos de tu local</div></div></div>
      <label>Mail del local<input id="email" type="email" autocomplete="username" required></label>
      <label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label>
      <button id="loginButton" type="submit">Ingresar</button>
      <div id="loginError" class="error" role="alert"></div>
    </form>
  </main>

  <main id="dashboardView" class="shell hidden">
    <header><div><div class="status">Actualización automática</div><h1 id="storeName" class="store-title"></h1><p id="period" class="period"></p></div><button id="logoutButton" class="logout">Salir</button></header>
    <section class="grid">
      <article class="card wide"><div class="label">Objetivo mensual</div><div id="goal" class="value"></div><div class="progress"><span id="monthBar"></span></div><div class="split"><span id="accumulated"></span><span id="monthPercent"></span></div></article>
      <article class="card"><div class="label">Falta para llegar</div><div id="remaining" class="value"></div><div id="remainingPercent" class="sub"></div></article>
      <article class="card"><div class="label">Venta de hoy</div><div id="todayAmount" class="value"></div><div id="todayDifference" class="sub"></div></article>
      <article class="card"><div class="label">Objetivo de hoy</div><div id="todayTarget" class="value"></div><div class="progress warn"><span id="todayBar"></span></div><div id="todayPercent" class="sub"></div></article>
      <article class="card"><div class="label">Objetivo diario ajustado</div><div id="requiredPerDay" class="value"></div><div id="remainingDays" class="sub"></div></article>
      <article class="card full"><div class="label">Objetivos de todo el mes</div><div style="overflow:auto"><table><thead><tr><th>Fecha</th><th>Objetivo</th><th>Venta</th><th>Cumplimiento</th><th>Diferencia</th></tr></thead><tbody id="monthPlan"></tbody></table></div></article>
      <article class="card full"><div class="label">Rendimiento diario</div><div style="overflow:auto"><table><thead><tr><th>Fecha</th><th>Venta</th><th>Objetivo</th><th>Cumplimiento</th><th>Diferencia</th></tr></thead><tbody id="history"></tbody></table></div></article>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
